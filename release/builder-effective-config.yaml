directories:
  output: release
  buildResources: build
appId: com.sietium-ai-studio.app
productName: Sietium-AI-Studio
files:
  - filter:
      - dist
      - dist-electron
      - node_modules
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
electronVersion: 30.5.1
